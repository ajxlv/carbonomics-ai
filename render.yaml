# Render blueprint for the analysis API (free plan). The website itself is hosted separately (Vercel).
# Secret values are asked for in the Render dashboard and are never stored in this file.
services:
  - type: web
    name: carbonomics-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
